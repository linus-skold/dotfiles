onboarding = false
[update]
channel = "preview"

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false

[terminal]
default_shell = "nu"

[keys]
switch_tab = "prefix+1..9"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"
focus_pane_left = "alt+left"


[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[theme]
# Base builtin under the Ember overrides below — warm dark so any field
# Ember does not override stays in the same family.
#name = "gruvbox"
#name = "catppuccin"
#name = "custom"
#auto_switch = false

# ---------------------------------------------------------------------------
# Ember — dark graphite, L10%   https://github.com/ember-theme/ember
# Matches alacritty/themes/ember.toml. Active.
# To switch to Ember Soft: comment this block out and uncomment the one below.
# ---------------------------------------------------------------------------
[theme.custom]
panel_bg      = "#1c1b19"   # bg
surface_dim   = "#151412"   # base0
surface0      = "#252422"   # base2
surface1      = "#2e2d2a"   # base3
overlay0      = "#585550"   # base5
overlay1      = "#706c61"   # base6
text          = "#d8d0c0"   # fg — warm ivory
subtext0      = "#b0a898"   # fg_alt
red           = "#b07878"   # rose
green         = "#8a9868"   # olive
yellow        = "#c8b468"   # gold
blue          = "#7890a0"   # steel
mauve         = "#988090"   # mauve
teal          = "#80a090"   # sage
peach         = "#c09058"   # orange
accent        = "#e08060"   # coral — hero accent

